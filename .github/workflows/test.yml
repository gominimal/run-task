name: Test

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # every other day at 06:00 UTC (odd days of the month)
    - cron: '0 6 */2 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hello-world:
    name: hello-world (${{ matrix.runner }}, ${{ matrix.channel }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
        channel: [stable, unstable, nightly]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Run hello-world task
        id: run-task
        uses: ./
        with:
          channel: ${{ matrix.channel }}
          task: hello-world

      - name: Verify version output
        env:
          VERSION: ${{ steps.run-task.outputs.version }}
        run: |
          echo "Resolved version: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "::error::action did not set the 'version' output"
            exit 1
          fi

  hello-env:
    name: hello-env (allow-env, ${{ matrix.channel }})
    strategy:
      fail-fast: false
      matrix:
        channel: [stable, unstable]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run hello-env task with the variable allowed
        uses: ./
        env:
          RUN_TASK_GREETING: hello from the runner
        with:
          channel: ${{ matrix.channel }}
          task: hello-env
          allow-env: |
            RUN_TASK_GREETING

  hooks:
    name: hooks (${{ matrix.hooks || 'unset' }})
    strategy:
      fail-fast: false
      matrix:
        hooks: ['', ignore, allow]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Job-local: gives the checkout a project hook, so `min task run` has a
      # hooks decision to make. Unstable only, where min gates project hooks.
      - name: Declare a project lifecycle hook
        run: |
          printf '\n[[session.lifecycle_hooks]]\non_activate = { type = "inline", value = "echo run-task hook" }\n' >> minimal.toml

      - name: Run hello-world task
        id: run
        continue-on-error: true
        uses: ./
        with:
          channel: unstable
          task: hello-world
          hooks: ${{ matrix.hooks }}

      - name: Verify the step outcome
        env:
          HOOKS: ${{ matrix.hooks }}
          OUTCOME: ${{ steps.run.outcome }}
        run: |
          # Undecided hooks fail without a terminal; that failure is what
          # makes the ignore and allow passes mean anything.
          want=success
          [ -n "$HOOKS" ] || want=failure
          if [ "$OUTCOME" != "$want" ]; then
            echo "::error::hooks='$HOOKS': expected $want, got '$OUTCOME'"
            exit 1
          fi

      # A second call in the same job replaces the policy the first one wrote.
      - name: Run hello-env task after the first call
        if: matrix.hooks != ''
        uses: ./
        env:
          RUN_TASK_GREETING: hello from the second step
        with:
          channel: unstable
          task: hello-env
          hooks: ${{ matrix.hooks }}
          allow-env: |
            RUN_TASK_GREETING

  task-failure:
    name: failing task fails the step
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run a task that does not exist
        id: missing
        continue-on-error: true
        uses: ./
        with:
          task: no-such-task

      - name: Verify the step failed
        env:
          OUTCOME: ${{ steps.missing.outcome }}
        run: |
          if [ "$OUTCOME" != "failure" ]; then
            echo "::error::expected the missing task to fail the step, got '$OUTCOME'"
            exit 1
          fi
