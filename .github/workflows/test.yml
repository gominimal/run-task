name: Test

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # every other day at 06:00 UTC (odd days of the month)
    - cron: '0 6 */2 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hello-world:
    name: hello-world (${{ matrix.runner }}, ${{ matrix.channel }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
        channel: [stable, unstable, nightly]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Run hello-world task
        id: run-task
        uses: ./
        with:
          channel: ${{ matrix.channel }}
          task: hello-world

      - name: Verify version output
        env:
          VERSION: ${{ steps.run-task.outputs.version }}
        run: |
          echo "Resolved version: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "::error::action did not set the 'version' output"
            exit 1
          fi

  notify:
    # Scheduled runs are unattended: on a failed or cancelled matrix job, file
    # (or comment on) one label-deduped tracking issue and post to Slack via
    # the org's promotion-notification webhook (same action/shape as
    # gominimal/minimal's promote.yml). PR and push runs already surface
    # failures on the commit/PR, so this only fires for schedule/dispatch.
    needs: [hello-world]
    if: >-
      always() &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      (needs.hello-world.result == 'failure' || needs.hello-world.result == 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Serialize: two overlapping runs could both miss the open issue and file
    # duplicates. Queue rather than cancel so no notification is dropped.
    concurrency:
      group: nightly-failure-notification-${{ github.repository }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update the nightly-failure issue
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESULT: ${{ needs.hello-world.result }}
        run: |
          set -euo pipefail
          title="Scheduled test lane failing"
          gh label create ci-nightly --repo "$GITHUB_REPOSITORY" \
            --color B60205 --description "Scheduled test-lane failure" 2>/dev/null || true
          body="$(printf 'A scheduled Test run failed or was cancelled.\n\n- hello-world matrix: %s\n\nRun: %s' "$RESULT" "$RUN_URL")"
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --label ci-nightly --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
            url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/issues/$existing"
          else
            url="$(gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body" --label ci-nightly)"
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Notify Slack
        # Still post if the issue step failed (e.g. gh error); the URL is then empty.
        if: ${{ always() }}
        continue-on-error: true
        timeout-minutes: 5
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "*Scheduled test lane failed:* `${{ github.repository }}`\nhello-world matrix: ${{ needs.hello-world.result }}\nIssue: ${{ steps.issue.outputs.url || 'unavailable' }}\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
