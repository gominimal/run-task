name: 'minimal run-task'
description: 'Runs a task declared in a repo''s `minimal.toml` with `min task run`'
inputs:
  task:
    description: 'Name of the task to run'
    required: true
  channel:
    description: 'The release channel to install Minimal from (stable, unstable, nightly)'
    required: false
    default: 'stable'
  allow-env:
    description: >-
      Environment variable names (one per line, globs allowed) the task's
      `env_vars` may inherit from the runner. Written to the runner user's
      `~/.config/minimal/user_policy.toml` `[vars] allow`; without a terminal,
      `min task run` fails on any declared name the policy does not list.
    required: false
    default: ''
  hooks:
    description: >-
      What to do with the project's lifecycle hooks: `ignore` (drop them) or
      `allow` (run them). Written to the same policy file as `allow-env`, as
      `[hooks] ignore` or `allow` for the checkout directory only; without a
      terminal, `min task run` fails on a project with hooks the policy does
      not decide.
    required: false
    default: ''
outputs:
  version:
    description: 'The specific version that the channel resolved to'
    value: ${{ steps.run.outputs.version }}
runs:
  using: 'composite'
  steps:
    - id: run
      shell: bash
      env:
        BASE: https://storage.googleapis.com/minimal-one
        INSTALLER: https://go.minimal.dev
        INPUT_TASK: ${{ inputs.task }}          # via env, not inline — injection-safe
        INPUT_CHANNEL: ${{ inputs.channel }}
        INPUT_ALLOW_ENV: ${{ inputs.allow-env }}
        INPUT_HOOKS: ${{ inputs.hooks }}
      run: |
        # ---- platform guard: bail before any bash-4+ syntax appears ----
        if [ "${RUNNER_OS:-$(uname -s)}" != "Linux" ]; then
          echo "::error::gominimal/run-task supports Linux only (got ${RUNNER_OS:-$(uname -s)})"
          exit 1
        fi

        set -euo pipefail   # everything below is free to use modern bash

        # ---- ensure unprivileged user namespaces are usable (idempotent) ----
        userns_knob=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
        if [[ -e "$userns_knob" ]]; then
          if [[ "$(cat "$userns_knob")" != "0" ]]; then
            echo "Lifting AppArmor unprivileged-userns restriction for minimald"
            if ! sudo -n sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; then
              echo "::error::passwordless sudo unavailable; set 'kernel.apparmor_restrict_unprivileged_userns=0' on this runner yourself (see README)"
              exit 1
            fi
          else
            echo "Unprivileged user namespaces already permitted"
          fi
        else
          echo "No AppArmor userns restriction on this kernel; nothing to do"
        fi

        # hardened fetch: $1 = URL, $2 = output file
        fetch() {
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 --retry 3 -fsSL "$1" -o "$2"
        }

        case "$INPUT_CHANNEL" in
          ''|.|..|*[!A-Za-z0-9._-]*) echo "::error::invalid channel '$INPUT_CHANNEL'"; exit 1 ;;
        esac

        case "$INPUT_HOOKS" in
          ''|ignore|allow) ;;
          *) echo "::error::invalid hooks '$INPUT_HOOKS'; use 'ignore' or 'allow'"; exit 1 ;;
        esac

        # ---- resolve version from the channel pointer ----
        ptr="$RUNNER_TEMP/channel-pointer"
        fetch "$BASE/$INPUT_CHANNEL" "$ptr"
        version="$(tr -d '[:space:]' < "$ptr")"
        [[ -n "$version" ]] || { echo "::error::empty version from channel '$INPUT_CHANNEL'"; exit 1; }
        echo "Resolved minimal version: $version (channel: $INPUT_CHANNEL)"
        echo "version=$version" >> "$GITHUB_OUTPUT"

        # ---- install min + minimald with the release installer ----
        # The installer resolves the same channel pointer, verifies every
        # component against the version's manifest, and installs to
        # ~/.local/bin. No terminal: it neither prompts nor runs
        # `min finalize-install` (the userns sysctl above is the one part of
        # that we need).
        installer="$RUNNER_TEMP/minimal-install.sh"
        fetch "$INSTALLER/$INPUT_CHANNEL" "$installer"
        MINIMAL_INSTALL_PLAIN=1 sh "$installer" </dev/null
        bin="${MINIMAL_BIN:-$HOME/.local/bin}"
        export PATH="$bin:$PATH"
        echo "$bin" >> "$GITHUB_PATH"
        installed="$(min --version)"
        echo "Installed: $installed"
        # `min --version` prints `min <version>`. A release pointer names the
        # version itself (0.7.0); nightly/unstable pointers name a commit,
        # which a dev build carries as its `.g<sha>` suffix
        # (0.8.0-dev.362.ga3f2fa97).
        installed_version="${installed##* }"
        case "$installed_version" in
          "$version"|*".g$version") ;;
          *) echo "::warning::installed '$installed' does not name the resolved version '$version' (the channel pointer moved during the step?)" ;;
        esac

        # ---- user policy for the task's env_vars and the project's hooks ----
        if [[ -n "${INPUT_ALLOW_ENV//[[:space:]]/}" || -n "$INPUT_HOOKS" ]]; then
          policy_dir="${XDG_CONFIG_HOME:-$HOME/.config}/minimal"
          policy="$policy_dir/user_policy.toml"
          # A file this action wrote (an earlier step in the same job) is
          # replaced; any other file is the runner owner's and is left alone.
          marker="# written by gominimal/run-task"
          if [[ -e "$policy" ]] && [[ "$(head -n 1 "$policy")" != "$marker" ]]; then
            echo "::error::$policy already exists; manage its [vars] and [hooks] rules yourself instead of passing allow-env or hooks"
            exit 1
          fi
          content="$marker"$'\n'
          allow=""
          while IFS= read -r name; do
            name="${name//[[:space:]]/}"
            [[ -n "$name" ]] || continue
            case "$name" in
              *[!A-Za-z0-9_*?]*) echo "::error::allow-env entry '$name' is not an environment variable name or glob"; exit 1 ;;
            esac
            allow="${allow:+$allow, }\"$name\""
          done <<< "$INPUT_ALLOW_ENV"
          if [[ -n "$allow" ]]; then
            content+="[vars]"$'\n'"allow = [$allow]"$'\n'
          fi
          if [[ -n "$INPUT_HOOKS" ]]; then
            # [hooks] patterns are globs matched against the project root, so
            # a workspace path holding a glob or TOML metacharacter would match
            # more (or less) than this checkout.
            case "$GITHUB_WORKSPACE" in
              /*) ;;
              *) echo "::error::GITHUB_WORKSPACE '$GITHUB_WORKSPACE' is not an absolute path"; exit 1 ;;
            esac
            case "$GITHUB_WORKSPACE" in
              *[][*?{}\\\"]*) echo "::error::GITHUB_WORKSPACE '$GITHUB_WORKSPACE' contains a glob or quote character; manage [hooks] in $policy yourself"; exit 1 ;;
            esac
            content+="[hooks]"$'\n'"$INPUT_HOOKS = [\"$GITHUB_WORKSPACE\"]"$'\n'
          fi
          mkdir -p "$policy_dir"
          printf '%s' "$content" > "$policy"
          echo "Wrote $policy:"
          cat "$policy"
        fi

        # ---- run ----
        # stdin closed: tasks run non-interactively, and an open pipe would
        # keep the run waiting (gominimal/minimal#1741).
        min task run "$INPUT_TASK" </dev/null
